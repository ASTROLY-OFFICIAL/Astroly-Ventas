<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>astroly · Tienda en línea</title>
<meta name="description" content="Tienda en línea de astroly: decoración para el hogar con pago en línea y precios en pesos o dólares.">
<link rel="icon" href="assets/img/isotipo.svg" type="image/svg+xml">
<script>document.documentElement.dataset.theme=localStorage.getItem('astroly-theme')||'light'</script>
<link rel="stylesheet" href="assets/css/tienda.css">
<script type="importmap">{"imports":{"three":"./assets/vendor/three.module.js"}}</script>
</head>
<body data-page="home">
<a class="skip" href="#catalogo">Saltar al catálogo</a>
<main class="main">
  <!-- Portada: título a la izquierda y el producto destacado en 3D a la derecha -->
  <section class="hero" id="inicio" aria-labelledby="hero-title">
    <div class="hero-copy">
      <span class="pill">Hogar y decoración</span>
      <h1 id="hero-title">Objetos que cambian tu espacio</h1>
      <p>Decoración elegida una a una. Pago en línea, en pesos o dólares.</p>
      <div class="hero-actions"><a class="button accent" href="#catalogo">Ver catálogo</a><a class="text-link" href="#novedades">Novedades</a></div>
    </div>
    <div class="hero-feature" data-feature>
      <div class="lamp-stage" aria-hidden="true"><svg class="lamp-callouts"></svg></div>
      <div class="feature-card">
        <div class="feature-head">
          <a class="feature-name" data-feature-link><span class="label">Destacado</span><strong data-feature-name></strong></a>
          <span class="feature-price" data-feature-price></span>
          <button type="button" class="feature-parts" data-explode aria-pressed="false">Ver piezas</button>
          <button type="button" class="button small accent" data-feature-add>Agregar</button>
        </div>
        <dl class="feature-stats">
          <div class="stat stat-rating"><dt>Calificación</dt><dd><span class="stat-num mono" data-count="rating">0</span><small>/5</small></dd>
            <span class="stars" data-stars></span></div>
          <div class="stat"><dt>Vendidas</dt><dd><span class="stat-num mono" data-count="sold">0</span><small>und.</small></dd>
            <span class="stat-bar"><i data-bar="sold"></i></span></div>
          <div class="stat"><dt>Reseñas</dt><dd><span class="stat-num mono" data-count="reviews">0</span></dd>
            <span class="stat-bar"><i data-bar="reviews"></i></span></div>
        </dl>
      </div>
    </div>
  </section>

  <!-- Novedades: fila deslizable -->
  <section class="row-section" id="novedades" aria-labelledby="new-title">
    <div class="section-head">
      <h2 id="new-title">Novedades</h2>
      <div class="row-arrows"><button type="button" class="icon-btn" data-row="-1" aria-label="Anteriores"></button><button type="button" class="icon-btn" data-row="1" aria-label="Siguientes"></button></div>
    </div>
    <div class="row-track"></div>
  </section>

  <!-- Catálogo -->
  <section class="catalog" id="catalogo" aria-labelledby="catalog-title">
    <div class="section-head">
      <h2 id="catalog-title">Catálogo <span class="results mono" aria-live="polite"></span></h2>
      <div class="catalog-tools">
        <label class="search"><span class="sr">Buscar en el catálogo</span><span class="search-icon" aria-hidden="true"></span><input type="search" placeholder="Buscar" autocomplete="off"></label>
        <label class="sort"><span class="sr">Ordenar</span><select><option value="rel">Destacados</option><option value="asc">Menor precio</option><option value="desc">Mayor precio</option><option value="az">A–Z</option></select></label>
      </div>
    </div>
    <div class="filters">
      <div class="chips" role="group" aria-label="Categoría" data-filter="col"></div>
      <div class="chips" role="group" aria-label="Precio" data-filter="price"></div>
      <div class="chips tones-filter" role="group" aria-label="Tono" data-filter="tone"></div>
    </div>
    <div class="grid"></div>
    <div class="catalog-empty" hidden><p>No hay productos con esos filtros.</p><button type="button" class="text-link" data-reset>Quitar filtros</button></div>
  </section>
</main>
<script type="module" src="assets/js/home.js"></script>
</body>
</html>
